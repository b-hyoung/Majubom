name: Development checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development check dependencies
        run: python -m pip install -e . opencv-python==5.0.0.93 "Pillow>=10,<13"
      - name: Run generated-input and SDK-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Build distributable
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Check real CLIP runtime with tiny random weights (not pretrained accuracy)
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.6
          python -m unittest discover -s tests -p test_clip_runtime.py -v
          python -m unittest discover -s tests -p test_person_crop.py -v
      - name: Check macOS model runtime and SDK imports
        if: runner.os == 'macOS'
        run: |
          python -m pip install torch==2.6.0 transformers==4.57.6 -e ".[live]"
          python -c "import torch, mediapipe, av, cv2; print('MPS available:', torch.backends.mps.is_available())"
          python -m unittest discover -s tests -p test_clip_runtime.py -v
          python -m unittest discover -s tests -p test_person_crop.py -v
      - name: Install browser regression tools
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check browser preview recovery
        if: runner.os == 'Linux'
        run: |
          python tests/browser_preview_recovery.py
          python tests/browser_record_comparison.py
          python tests/browser_posture_separation.py
          python tests/browser_body_state.py
          python tests/browser_clip_posture.py
          python tests/browser_camera_decoupling.py
          python tests/browser_multiview_posture.py
          python tests/browser_multicamera_setup.py
          python tests/browser_person_crop.py
          python tests/browser_posture_stability.py
