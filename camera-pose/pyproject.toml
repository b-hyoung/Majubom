[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bed-pose-benchmark"
version = "0.8.0"
description = "Foundations for reproducible bed pose benchmarks"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.26,<3", "av==18.1.0"]

[project.optional-dependencies]
mediapipe = ["mediapipe==0.10.35"]
live = ["mediapipe==0.10.35", "cv2-enumerate-cameras>=1.1,<2"]
stereo = ["opencv-contrib-python>=4.10,<5"]
clip = ["torch>=2.6,<3", "transformers==4.57.6", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bed_pose = ["schemas/*.json", "templates/*.html", "static/monitor/*"]
