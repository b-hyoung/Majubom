<text x="187" y="267" font-size="29" font-weight="700" text-anchor="middle" fill="#172033">카메라 영상</text>
<text x="187" y="300" font-size="24" font-weight="400" text-anchor="middle" fill="#526175">실시간 / 저장 영상</text>
<text x="533" y="267" font-size="29" font-weight="700" text-anchor="middle" fill="#172033">ToF · mmWave</text>
<text x="533" y="300" font-size="24" font-weight="400" text-anchor="middle" fill="#526175">센서 입력</text>
<text x="187" y="402" font-size="29" font-weight="700" text-anchor="middle" fill="#172033">스켈레톤 추정</text>
<text x="187" y="444" font-size="28" font-weight="400" text-anchor="middle" fill="#172033">침대 영역 관리</text>
<text x="533" y="402" font-size="29" font-weight="700" text-anchor="middle" fill="#172033">외부 시스템의</text>
<text x="533" y="444" font-size="28" font-weight="400" text-anchor="middle" fill="#172033">독립 분석</text>
<text x="187" y="552" font-size="28" font-weight="700" text-anchor="middle" fill="#172033">자세·점유 상태</text>
<text x="187" y="590" font-size="28" font-weight="400" text-anchor="middle" fill="#172033">이탈·복귀 이벤트</text>
<text x="187" y="623" font-size="22" font-weight="400" text-anchor="middle" fill="#526175">결과·시각 기록</text>
<text x="533" y="561" font-size="29" font-weight="700" text-anchor="middle" fill="#172033">센서 결과</text>
<text x="533" y="607" font-size="28" font-weight="400" text-anchor="middle" fill="#172033">측정 시각</text>
