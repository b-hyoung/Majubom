<polygon points="360.0,695.0 365.0,684.0 355.0,684.0" fill="#64748b"/>
<rect x="28" y="704" width="664" height="102" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="360" y="748" font-size="31" font-weight="700" text-anchor="middle" fill="#172033">같은 시간·라벨로 정렬</text>
<text x="360" y="783" font-size="25" font-weight="400" text-anchor="middle" fill="#526175">두 시스템이 독립적으로 만든 결과</text>
<polyline points="360,809 360,835 187,835 187,857" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="187.0,857.0 192.0,846.0 182.0,846.0" fill="#64748b"/>
<polyline points="360,835 533,835 533,857" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="533.0,857.0 538.0,846.0 528.0,846.0" fill="#64748b"/>
<rect x="28" y="866" width="318" height="136" rx="16" fill="#eaf1ff" stroke="#c5d8fa" stroke-width="2"/>
<text x="187" y="909" font-size="29" font-weight="700" text-anchor="middle" fill="#245fcc">결과 일치도 비교</text>
<text x="187" y="950" font-size="27" font-weight="400" text-anchor="middle" fill="#172033">일치·불일치</text>
<text x="187" y="987" font-size="27" font-weight="400" text-anchor="middle" fill="#172033">이벤트 시점 차이</text>
<rect x="374" y="866" width="318" height="136" rx="16" fill="#eaf6f1" stroke="#bedfd2" stroke-width="2"/>
<text x="533" y="909" font-size="29" font-weight="700" text-anchor="middle" fill="#167359">정답 기준 평가</text>
<text x="533" y="950" font-size="27" font-weight="400" text-anchor="middle" fill="#172033">각 시스템의 정확도</text>
<text x="533" y="987" font-size="25" font-weight="400" text-anchor="middle" fill="#526175">정답 확보 구간만</text>
<rect x="374" y="1054" width="318" height="88" rx="16" fill="#ffffff" stroke="#bedfd2" stroke-width="2"/>
<text x="533" y="1091" font-size="28" font-weight="700" text-anchor="middle" fill="#167359">실제 정답 확인</text>
<text x="533" y="1125" font-size="24" font-weight="400" text-anchor="middle" fill="#526175">관찰·영상 검토</text>
<polyline points="533,1051 533,1011" fill="none" stroke="#167359" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="533.0,1011.0 528.0,1022.0 538.0,1022.0" fill="#167359"/>
<text x="187" y="1085" font-size="28" font-weight="700" text-anchor="middle" fill="#172033">일치도 ≠ 정확도</text>
<text x="187" y="1123" font-size="24" font-weight="400" text-anchor="middle" fill="#526175">서로 다른 평가로 구분</text>
<text x="360" y="1170" font-size="21" font-weight="400" text-anchor="middle" fill="#526175">카메라 예측에는 센서 결과·목표 자세를 넣지 않음</text>
</g>
</svg>
