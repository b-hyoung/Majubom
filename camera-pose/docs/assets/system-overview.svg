<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1184" viewBox="0 0 720 1184" role="img" aria-labelledby="title desc">
<title id="title">카메라 기반 침대 자세 분석과 외부 센서 비교 구조</title>
<desc id="desc">설계 초안이며 구현 전입니다. 카메라와 ToF·mmWave는 각각 독립적으로 분석합니다. 두 시스템의 결과를 같은 시간과 라벨로 정렬한 뒤 일치도와 이벤트 시점 차이를 비교합니다. 관찰 또는 영상 검토로 실제 정답을 확보한 구간에서는 각 시스템의 정확도를 별도로 평가합니다. 외부 결과와 목표 자세는 카메라 예측 입력에 사용하지 않습니다.</desc>
<rect width="720" height="1184" fill="#f8fafc"/>
<g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="28" y="64" font-size="38" font-weight="700" text-anchor="start" fill="#172033">침대 자세 분석·비교 구조</text>
<text x="28" y="108" font-size="24" font-weight="400" text-anchor="start" fill="#526175">현재 설계 · 모델·장비 미선정 · 구현 전</text>
