<text x="187" y="188" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">카메라 AI</text>
<rect x="374" y="144" width="318" height="66" rx="16" fill="#7752b8"/>
<text x="533" y="188" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">외부 센서</text>
<rect x="28" y="230" width="318" height="88" rx="16" fill="#eff5ff" stroke="#c5d8fa" stroke-width="2"/>
