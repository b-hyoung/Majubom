name: Camera pose and ToF research checks
on:
  push:
    paths: ['camera-pose/**', '.github/workflows/camera-pose.yml']
  pull_request:
    paths: ['camera-pose/**', '.github/workflows/camera-pose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: camera-pose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . 'opencv-contrib-python>=4.10,<5' 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests
      - name: Parse Windows Pi + USB launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Start-PiUsb.ps1'), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - run: npm ci
        working-directory: camera-pose/tools/room-monitor
      - run: npm run build
        working-directory: camera-pose/tools/room-monitor
      - run: node --test smoothing.test.mjs
        working-directory: camera-pose/tools/room-monitor
  synthetic-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: camera-pose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . -r training/requirements.txt
      - run: python training/smoke_training.py --out outputs/ci-smoke
      - run: python -m bed_pose.tof_learning train outputs/ci-smoke/samples.jsonl --reviews outputs/ci-smoke/reviews.jsonl --split outputs/ci-smoke/split.json --out outputs/ci-smoke/run --device cpu --epochs 1 --trees 3 --window 8 --stride 8 --batch 24
