[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; woojin PC 로컬 경로(lib_extra_dirs) 대신 PlatformIO 레지스트리에서 자동으로 받게 변경
; → 어느 PC에서 빌드하든 그대로 동작 (test_8x8/firmware/platformio.ini와 동일 방식)
lib_deps =
	stm32duino/STM32duino VL53L5CX@^1.2.3
	bblanchon/ArduinoJson@^7
