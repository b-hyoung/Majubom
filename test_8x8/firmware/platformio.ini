[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 원본(TOF/src/platformio.ini)은 lib_extra_dirs로 로컬 폴더 경로를 썼지만(PC마다 달라 이식 안 됨),
; 이 테스트 사본은 PlatformIO 라이브러리 레지스트리에서 자동으로 받아오게 바꿔서
; 어느 PC에서 빌드하든 그대로 동작하게 함.
lib_deps =
	stm32duino/STM32duino VL53L5CX@^1.2.3
	bblanchon/ArduinoJson@^7
